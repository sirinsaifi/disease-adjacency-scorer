[tool.poetry]
name = "disease-adjacency-scorer"
version = "0.1.0"
description = "Scores biological adjacency between disease indications using Open Targets, EFO ontology, and FAERS adverse-event evidence."
authors = []
packages = [{ include = "disease_adjacency", from = "src" }]

[tool.poetry.dependencies]
python = "^3.10"
requests = ">=2.28"
pyyaml = ">=6.0"
scipy = ">=1.10"
fastapi = ">=0.100"
uvicorn = {extras = ["standard"], version = ">=0.22"}

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
pytest-mock = ">=3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
